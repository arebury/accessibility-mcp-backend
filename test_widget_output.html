<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Color Accessibility Checker</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f7;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.07);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 32px;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 600;
    }

    .summary-cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 32px;
    }

    .summary-card {
      background: #f8f8f8;
      border-radius: 12px;
      padding: 24px;
      text-align: center;
    }

    .summary-value {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .summary-label {
      font-size: 14px;
      color: #86868b;
    }

    .color-pairs-list {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .color-pair-card {
      border: 1px solid #e5e5e5;
      border-radius: 12px;
      padding: 20px;
    }

    .pair-header {
      font-size: 14px;
      color: #86868b;
      margin-bottom: 12px;
      font-weight: 500;
    }

    .color-preview-section {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-bottom: 16px;
    }

    .color-preview {
      flex: 1;
      height: 80px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 600;
      border: 1px solid rgba(0, 0, 0, 0.1);
    }

    .ratio-badge {
      background: #34C759;
      color: white;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 14px;
    }

    .ratio-badge.fail {
      background: #FF3B30;
    }

    .ratio-value {
      font-size: 20px;
      font-weight: 600;
      margin-top: 8px;
    }

    .color-codes {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .color-code {
      font-family: 'Monaco', monospace;
      font-size: 13px;
      padding: 8px 12px;
      background: #f5f5f5;
      border-radius: 6px;
    }

    .color-code-label {
      font-size: 11px;
      color: #86868b;
      margin-bottom: 4px;
      text-transform: uppercase;
      font-weight: 600;
    }

    .wcag-levels {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    .wcag-badge {
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }

    .wcag-badge.pass {
      background: #d1f4e0;
      color: #0f6537;
    }

    .wcag-badge.fail {
      background: #ffe5e5;
      color: #c41e3a;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎨 Color Accessibility Checker</h1>
    </div>

    <div class="summary-cards">
      <div class="summary-card">
        <div class="summary-value" id="passing-count">0</div>
        <div class="summary-label">Passing</div>
      </div>
      <div class="summary-card">
        <div class="summary-value" id="failing-count">0</div>
        <div class="summary-label">Failures</div>
      </div>
      <div class="summary-card">
        <div class="summary-value" id="texts-count">0</div>
        <div class="summary-label">Total</div>
      </div>
    </div>

    <div id="colors-content" class="color-pairs-list"></div>
  </div>

  <script>
    const sampleData = {"summary": {"total_pairs": 3, "passing_pairs": 2, "failing_pairs": 1, "detected_texts": 3}, "color_pairs": [{"id": "pair-0", "text": "Color Pair 1", "background": "#ffffff", "foreground": "#767676", "contrast_ratio": 4.54, "wcag_aa": {"normal_text": true, "large_text": true}, "wcag_aaa": {"normal_text": false, "large_text": false}, "status": "pass", "suggestions": []}, {"id": "pair-1", "text": "Color Pair 2", "background": "#000000", "foreground": "#ffffff", "contrast_ratio": 21.0, "wcag_aa": {"normal_text": true, "large_text": true}, "wcag_aaa": {"normal_text": true, "large_text": true}, "status": "pass", "suggestions": []}, {"id": "pair-2", "text": "Color Pair 3", "background": "#ff6b6b", "foreground": "#ffe66d", "contrast_ratio": 2.22, "wcag_aa": {"normal_text": false, "large_text": false}, "wcag_aaa": {"normal_text": false, "large_text": false}, "status": "fail", "suggestions": []}]}; 
 const _ignored = {
      summary: { total_pairs: 0, passing_pairs: 0, failing_pairs: 0, detected_texts: 0 },
      color_pairs: []
    };

    function renderColorPair(pair) {
      return `
        <div class="color-pair-card">
          <div class="pair-header">${pair.text || 'Color Pair'}</div>
          
          <div class="color-preview-section">
            <div class="color-preview" style="background: ${pair.background}; color: ${pair.foreground};">
              Aa
            </div>
            <div>
              <div class="ratio-badge ${pair.status === 'pass' ? '' : 'fail'}">
                ${pair.status === 'pass' ? 'PASS' : 'FAIL'}
              </div>
              <div class="ratio-value">${pair.contrast_ratio}:1</div>
            </div>
          </div>

          <div class="color-codes">
            <div>
              <div class="color-code-label">Background</div>
              <div class="color-code">${pair.background}</div>
            </div>
            <div>
              <div class="color-code-label">Foreground</div>
              <div class="color-code">${pair.foreground}</div>
            </div>
          </div>

          <div class="wcag-levels">
            <span class="wcag-badge ${pair.wcag_aa.normal_text ? 'pass' : 'fail'}">AA Normal: ${pair.wcag_aa.normal_text ? '✓' : '✗'}</span>
            <span class="wcag-badge ${pair.wcag_aa.large_text ? 'pass' : 'fail'}">AA Large: ${pair.wcag_aa.large_text ? '✓' : '✗'}</span>
            <span class="wcag-badge ${pair.wcag_aaa.normal_text ? 'pass' : 'fail'}">AAA Normal: ${pair.wcag_aaa.normal_text ? '✓' : '✗'}</span>
            <span class="wcag-badge ${pair.wcag_aaa.large_text ? 'pass' : 'fail'}">AAA Large: ${pair.wcag_aaa.large_text ? '✓' : '✗'}</span>
          </div>
        </div>
      `;
    }

    function renderResults(data) {
      document.getElementById('passing-count').textContent = data.summary.passing_pairs;
      document.getElementById('failing-count').textContent = data.summary.failing_pairs;
      document.getElementById('texts-count').textContent = data.summary.total_pairs;

      const container = document.getElementById('colors-content');
      container.innerHTML = data.color_pairs.map(pair => renderColorPair(pair)).join('');
    }

    renderResults(sampleData);
  </script>
</body>
</html>
